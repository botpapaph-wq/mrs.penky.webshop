# Selbstdiagnose, zweiter Durchgang.
#
# Erkenntnis aus dem ersten Lauf: GitHub Pages kann von keinem Workflow
# eingeschaltet werden (403 "Resource not accessible by integration"),
# schreiben ins Repo darf der Workflow dagegen sehr wohl.
#
# Der Actions-Runner hat vollen Internetzugang, auch zu api.cloudflare.com.
# Wenn im Repo ein Cloudflare-Token als Secret hinterlegt ist, lässt sich von
# hier aus direkt nach Cloudflare Pages deployen -- auf die echte Domain, ohne
# dass jemand ein Dashboard öffnen muss.
#
# Dieser Lauf prüft nur, WELCHE Secrets gesetzt sind. Es werden keine Werte
# ausgegeben, nur ob vorhanden und wie lang -- das genügt zur Entscheidung und
# verrät nichts.

name: Diagnose

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vorhandene Secrets feststellen
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PAGES_DEPLOY_HOOK: ${{ secrets.PAGES_DEPLOY_HOOK }}
        run: |
          mkdir -p .github
          F=.github/DIAGNOSE.md
          {
            echo "# Selbstdiagnose des Deployments"
            echo
            echo "Lauf: $(date -u '+%Y-%m-%d %H:%M UTC')  ·  Commit \`${GITHUB_SHA::7}\`"
            echo
            echo '## Ergebnis Durchgang 1'
            echo
            echo '- Repo ist oeffentlich, `has_pages: false`'
            echo '- `POST /pages` -> 403 "Resource not accessible by integration"'
            echo '- GitHub Pages laesst sich per Workflow NICHT einschalten'
            echo '- Schreiben ins Repo funktioniert (diese Datei ist der Beweis)'
            echo
            echo '## Durchgang 2: welche Secrets sind hinterlegt?'
            echo
            echo '| Secret | gesetzt | Laenge |'
            echo '|---|---|---|'
            for n in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID CF_API_TOKEN CF_ACCOUNT_ID \
                     CLOUDFLARE_TOKEN SUPABASE_ACCESS_TOKEN SUPABASE_SERVICE_ROLE_KEY PAGES_DEPLOY_HOOK; do
              v="${!n}"
              if [ -n "$v" ]; then echo "| \`$n\` | JA | ${#v} |"; else echo "| \`$n\` | nein | - |"; fi
            done
            echo
            echo 'Steht bei CLOUDFLARE_API_TOKEN (oder CF_API_TOKEN) ein JA, kann der'
            echo 'naechste Lauf mit `wrangler pages deploy src` direkt auf mrspenky.shop'
            echo 'veroeffentlichen -- ohne Dashboard, ohne Klick.'
          } > "$F"
          cat "$F"

      - name: Ergebnis ins Repo zurueckschreiben
        continue-on-error: true
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add .github/DIAGNOSE.md
          git commit -m "Diagnose 2: welche Deploy-Secrets liegen im Repo" || echo "nichts zu committen"
          git push || echo "PUSH VERWEIGERT"
