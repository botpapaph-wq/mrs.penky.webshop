name = "mrs-penky-webshop"
type = "javascript"
account_id = "YOUR_CLOUDFLARE_ACCOUNT_ID"
workers_dev = true
main = "src/index.js"
site = { bucket = "src" }

[env.production]
name = "mrs-penky-webshop-prod"
route = "https://mrs.penky.com/*"
zone_id = "YOUR_CLOUDFLARE_ZONE_ID"

[build]
command = "npm run build"
cwd = "./"

[build.upload]
format = "modules"
main = "./src/index.js"

[[env.production.triggers.crons]]
cron = "0 0 * * *"

[env.production.bindings]
AI = { binding = "Workers AI" }
SUPABASE_URL = "https://YOUR_PROJECT.supabase.co"
SUPABASE_ANON_KEY = "YOUR_ANON_KEY"
SUPABASE_SERVICE_ROLE_KEY = "YOUR_SERVICE_ROLE_KEY"
PAYMONGO_SECRET_KEY = "sk_live_..."
PAYMONGO_WEBHOOK_SECRET = "whsk_..."
STRIPE_SECRET_KEY = "sk_live_..."
STRIPE_WEBHOOK_SECRET = "whsec_..."
ZOHO_ACCESS_TOKEN = "YOUR_ZOHO_TOKEN"
ZOHO_REFRESH_TOKEN = "YOUR_ZOHO_REFRESH"

[observability]
enabled = true
